# ReportLens on Render's FREE web service (512 MB RAM, 0.1 CPU, sleeps after 15 idle minutes, temporary disk).
# Blueprint: Render dashboard -> New -> Blueprint -> pick the repository that contains this file.  Full guide: docs/DEPLOY.md.
#
# Secrets are NOT in this file.  Render asks for the two `sync: false` values once, while the Blueprint is created; type them
# into Render's own form (never into a file, a chat or an e-mail).  SESSION_SECRET is generated by Render.
services:
  - type: web
    name: reportlens
    runtime: docker
    plan: free
    region: oregon                   # oregon (default), ohio, virginia, frankfurt or singapore: pick the one nearest your visitors
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health     # open and cheap: no OpenAI call
    autoDeployTrigger: "off"         # deploy by hand (Manual Deploy) so a stray push cannot change a public, billed app
    envVars:
      # ---- secrets: typed in the Render dashboard
      - key: OPENAI_API_KEY          # a separate key from a project with its own monthly limit (docs/DEPLOY.md, step 1)
        sync: false
      - key: ACCESS_CODE             # 12+ random characters; this is what you send to visitors
        sync: false
      - key: SESSION_SECRET          # keeps visitors signed in across sleep/wake; generated once by Render
        generateValue: true
      # ---- public-demo safety rails
      - key: PUBLIC_MODE
        value: "1"
      - key: TRUST_PROXY               # Render's proxy sets X-Forwarded-*: needed for per-visitor limits and the https cookie
        value: "1"
      - key: ALLOWED_HOSTS
        value: .onrender.com           # add your own domain here (comma separated) if you attach one
      - key: BUDGET_USD_TOTAL          # estimated spend per run of the service (resets on every wake-up!): the OpenAI-side limit is the real ceiling
        value: "10"
      - key: MAX_SESSIONS
        value: "10"
      - key: QUESTIONS_PER_HOUR_PER_IP
        value: "15"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PAGES
        value: "400"
      # ---- small-host settings (512 MB / 0.1 CPU)
      - key: LOW_MEMORY                # also switched on automatically when the container limit is <= 600 MB
        value: "1"
      - key: REPORTLENS_DATA_DIR       # the free disk is temporary anyway
        value: /tmp/reportlens
      - key: MALLOC_ARENA_MAX          # fewer glibc heaps = less memory
        value: "2"
