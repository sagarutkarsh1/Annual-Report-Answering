<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Annual Report Lens: chat with an annual report. Every answer is cited to the page and scored live with RAGAS." />
    <title>Annual Report Lens</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%232d72cf'/%3E%3Cpath d='M9 6.5h7l4 4V21a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1z' fill='%23fff'/%3E%3Ccircle cx='14.2' cy='15.2' r='3' fill='none' stroke='%232d72cf' stroke-width='1.6'/%3E%3Cpath d='M16.4 17.4 18.6 19.6' stroke='%232d72cf' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preload" href="/static/vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/viewer.css" />
    <link rel="stylesheet" href="/static/css/sourcecard.css" />
    <link rel="stylesheet" href="/static/css/questionset.css" />
    <!-- DOMPurify UMD build: defines window.DOMPurify before the app modules run. -->
    <script src="/static/vendor/dompurify/purify.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#composer-input">Skip to composer</a>

    <div id="app">
      <aside id="sidebar" aria-label="Chats and navigation"></aside>
      <div id="scrim" aria-hidden="true"></div>

      <div id="card">
        <main id="chat-pane"></main>
        <div id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize source panel" aria-valuemin="0" aria-valuemax="60" aria-valuenow="42" tabindex="0"></div>
        <aside id="source-panel" aria-label="Source document"></aside>
      </div>

      <div id="boot" role="status" aria-label="Loading Annual Report Lens">
        <svg class="icon spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript>Annual Report Lens needs JavaScript.</noscript>
  </body>
</html>
